<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inson Tana A'zolari - Duolingo Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Rasmiy Telegram Web App SDK — Mini App'ni to'g'ri initsializatsiya qilish uchun shart.
         Buni ulamasdan Telegram ba'zan sahifani "noma'lum tashqi sayt" deb hisoblab,
         qo'shimcha cheklovlar (jumladan media/audio bo'yicha) qo'llashi mumkin. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: #f7f7f7; color: #3c3c3c; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 30px; margin-top: 20px; text-align: center; }
        h1 { color: #58cc02; margin-bottom: 20px; }
        .menu-btn { display: block; width: 100%; padding: 16px; margin: 15px 0; font-size: 18px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .back-btn { background: #e5e5e5; color: #4b4b4b; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; float: left; }
        .q-text { font-size: 22px; font-weight: 800; margin: 30px 0; color: #4b4b4b; }
        .spell-input { width: 100%; padding: 20px; font-size: 20px; border: 2px solid #e5e5e5; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .check-btn { background: #58cc02; color: white; border: none; border-bottom: 4px solid #46a302; width: 100%; padding: 16px; font-size: 18px; font-weight: 800; border-radius: 16px; cursor: pointer; margin-top: 10px; }
        .feedback { font-size: 18px; font-weight: 700; margin: 15px 0; padding: 15px; border-radius: 12px; }
        .vocab-item { display: flex; justify-content: space-between; align-items: center; background: #f7f7f7; padding: 15px; margin: 10px 0; border-radius: 16px; border: 2px solid #e5e5e5; border-bottom-width: 4px; text-align: left; }
        .speak-btn { background: #ff4b4b; color: white; border: none; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; position: relative; }
        .speak-btn.loading { opacity: 0.6; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .test-btn { background: white; border: 2px solid #e5e5e5; border-radius: 16px; padding: 20px; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.2s; border-bottom: 4px solid #e5e5e5; }
        .test-btn:hover { background: #f0f9ff; border-color: #1cb0f6; }
        .test-btn.selected { background: #ddf4ff; border-color: #1cb0f6; color: #1899d6; border-bottom: 4px solid #1cb0f6; }

        .img-item { font-size: 40px; margin-right: 15px; }

        .card-box { background: #f7f7f7; border: 2px solid #e5e5e5; border-bottom: 4px solid #e5e5e5; border-radius: 20px; padding: 30px; margin: 20px 0; text-align: center; }
        .card-icon { font-size: 80px; margin-bottom: 15px; }
        .card-word { font-size: 26px; font-weight: 800; color: #3c3c3c; margin-bottom: 5px; }
        .card-uz { font-size: 20px; font-weight: 600; color: #777; margin-bottom: 20px; }

        .sound-status { font-size: 12px; color: #999; margin-top: 10px; min-height: 16px; }

        .go-timer-bar-wrap { width: 100%; height: 10px; background: #e5e5e5; border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        .go-timer-bar { height: 100%; background: #58cc02; transition: width 1s linear; }
        .go-score { font-size: 16px; font-weight: 700; color: #777; margin-bottom: 15px; }
        .test-btn:disabled { cursor: default; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container" id="main-menu">
        <h1>Inson Tana A'zolari</h1>
        <button class="menu-btn" style="background:#1cb0f6" onclick="go(1)">📖 Lug'at</button>
        <button class="menu-btn" style="background:#ff9600" onclick="go(4)">🖼️ Rasimli Lug'at</button>
        <button class="menu-btn" style="background:#2b82ff" onclick="go(5)">🃏 Dona-dona Rasimli Lug'at</button>
        <button class="menu-btn" style="background:#58cc02" onclick="go(2)">🎮 Test O'yini</button>
        <button class="menu-btn" style="background:#ce82ff" onclick="go(3)">✏️ Spelling Test</button>
        <button class="menu-btn" style="background:#ff4b4b" onclick="go(6)">⚡ Go</button>
        <div class="sound-status" id="sound-status"></div>
    </div>

    <div class="container hidden" id="game-container">
        <button class="back-btn" onclick="go(0)">← Menyu</button>
        <div id="content-area" style="clear:both;"></div>
        <div id="feedback-area"></div>
        <button class="check-btn hidden" id="next-btn" onclick="nextQuestion()">Keyingisi</button>
    </div>

    <script>
        // Har bir so'z uchun to'g'ridan-to'g'ri ishlaydigan audio havolalari bilan boyitilgan baza
        const data = [
            { en: "Head", uz: "Bosh", icon: "🧠", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/head-us.mp3" },
            { en: "Eye", uz: "Ko'z", icon: "👁️", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/eye-us.mp3" },
            { en: "Ear", uz: "Quloq", icon: "👂", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/ear-us.mp3" },
            { en: "Nose", uz: "Burun", icon: "👃", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/nose-us.mp3" },
            { en: "Mouth", uz: "Og'iz", icon: "👄", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/mouth-us.mp3" },
            { en: "Hand", uz: "Qo'l", icon: "✋", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/hand-us.mp3" },
            { en: "Leg", uz: "Oyoq", icon: "🦵", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/leg-us.mp3" },
            { en: "Tooth", uz: "Tish", icon: "🦷", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/tooth-us.mp3" },
            { en: "Hair", uz: "Soch", icon: "👱", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/hair-us.mp3" },
            { en: "Finger", uz: "Barmoq", icon: "👆", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/finger-us.mp3" }
        ];

        let mode, idx, score, errs, correctList, qs, selectedAns;
        let goScore, goTimeLeft, goCurrent, goInterval, goDuration;

        /* =========================================================
           IShONCHLI OVOZ TIZIMI (barcha qurilmalar, jumladan
           Telegram Android WebView uchun)
           ---------------------------------------------------------
           MUHIM: fetch()+blob usuli ISHLATILMAYDI, chunki Telegram
           Android WebView tashqi domenlarga fetch() so'rovlarini
           ko'pincha CORS/xavfsizlik siyosati bilan bloklaydi.

           Buning o'rniga har bir so'z uchun haqiqiy <audio> DOM
           elementi yaratiladi va asl MP3 manziliga to'g'ridan-to'g'ri
           ulanadi. <audio>/<video> elementlari faqat ijro etish
           uchun CORS tekshiruvidan o'tishi shart emas — shuning
           uchun bu ancha ishonchli.

           Agar MP3 baribir ishlamasa (xato hodisasi chiqsa) —
           qurilmaning ichki Text-to-Speech tizimi orqali fallback
           ishlaydi. Agar u ham mavjud bo'lmasa — foydalanuvchiga
           vibratsiya orqali bosilgani bildiriladi (jim qolmaydi).
           ========================================================= */

        // Telegram Web App SDK'ni to'g'ri initsializatsiya qilish
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            } catch (e) { console.log('Telegram WebApp init xatosi:', e); }
        }

        // Har bir so'z uchun haqiqiy <audio> elementini oldindan yaratamiz
        const audioHolder = document.createElement('div');
        audioHolder.style.display = 'none';
        document.body.appendChild(audioHolder);

        data.forEach(item => {
            const el = document.createElement('audio');
            el.src = item.audio;
            el.preload = 'auto';
            el.setAttribute('playsinline', '');
            el.addEventListener('error', () => { item.broken = true; });
            audioHolder.appendChild(el);
            item.audioEl = el;
        });

        // Birinchi tegishda barcha audio elementlarni "uyg'otish" —
        // iOS/Android WebView'larning media-sessiyasini faollashtiradi.
        let audioUnlocked = false;
        function unlockAudioOnce() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            data.forEach(item => {
                const el = item.audioEl;
                if (!el) return;
                const prevVolume = el.volume;
                el.volume = 0;
                const p = el.play();
                if (p && p.then) {
                    p.then(() => {
                        el.pause();
                        el.currentTime = 0;
                        el.volume = prevVolume;
                    }).catch(() => { el.volume = prevVolume; });
                } else {
                    el.volume = prevVolume;
                }
            });
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        }
        document.addEventListener('touchstart', unlockAudioOnce, { once: true, passive: true });
        document.addEventListener('click', unlockAudioOnce, { once: true });

        function speakFallbackTTS(word) {
            if (!('speechSynthesis' in window) || !window.speechSynthesis) {
                signalTapWithoutSound();
                return;
            }
            try {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(word);
                utter.lang = 'en-US';
                utter.rate = 0.9;
                let spoke = false;
                utter.onstart = () => { spoke = true; };
                window.speechSynthesis.speak(utter);
                // Ba'zi WebView'larda speak() jim tursa, foydalanuvchiga bildiramiz
                setTimeout(() => { if (!spoke) signalTapWithoutSound(); }, 600);
            } catch (e) {
                signalTapWithoutSound();
            }
        }

        // Na MP3, na TTS ishlamasa — hech bo'lmasa vibratsiya bilan bildiramiz
        function signalTapWithoutSound() {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                } else if (navigator.vibrate) {
                    navigator.vibrate(80);
                }
            } catch (e) {}
        }

        // Bu funksiya har doim onclick ichida, TO'G'RIDAN-TO'G'RI (sinxron)
        // chaqirilishi kerak — shundagina "user gesture" saqlanib qoladi.
        function speakWord(enWord) {
            const item = data.find(w => w.en.toLowerCase() === enWord.toLowerCase());
            if (!item) return;

            if (item.broken || !item.audioEl) {
                speakFallbackTTS(item.en);
                return;
            }

            try {
                const el = item.audioEl;
                el.currentTime = 0;
                const playPromise = el.play();
                if (playPromise && playPromise.catch) {
                    playPromise.catch(() => speakFallbackTTS(item.en));
                }
            } catch (e) {
                speakFallbackTTS(item.en);
            }
        }

        function go(m) {
            if(m === 0) { document.getElementById('main-menu').classList.remove('hidden'); document.getElementById('game-container').classList.add('hidden'); }
            else {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                mode = m; idx = 0; score = 0; errs = []; correctList = []; qs = [...data];
                if(m === 1) renderVocab();
                else if(m === 4) renderImgVocab();
                else if(m === 5) renderSingleCard();
                else { qs.sort(()=>Math.random()-0.5); renderQ(); }
            }
        }

        function renderVocab() {
            document.getElementById('content-area').innerHTML = '<h2 style="margin:20px 0;">Lug\'at</h2>' + data.map(w => `<div class="vocab-item"><b>${w.en} - ${w.uz}</b> <button class="speak-btn" onclick="speakWord('${w.en}')">🔊</button></div>`).join('');
            document.getElementById('feedback-area').innerHTML = ''; document.getElementById('next-btn').classList.add('hidden');
        }

        function renderImgVocab() {
            document.getElementById('content-area').innerHTML = '<h2 style="margin:20px 0;">Rasimli Lug\'at</h2>' + data.map(w => `<div class="vocab-item"><span class="img-item">${w.icon}</span> <b>${w.en} - ${w.uz}</b> <button class="speak-btn" onclick="speakWord('${w.en}')">🔊</button></div>`).join('');
            document.getElementById('feedback-area').innerHTML = ''; document.getElementById('next-btn').classList.add('hidden');
        }

        function renderSingleCard() {
            document.getElementById('feedback-area').innerHTML = '';
            if(idx >= qs.length) {
                document.getElementById('content-area').innerHTML = `<h2>Tugatdingiz!</h2><button class="menu-btn" style="background:#58cc02; margin-top:20px;" onclick="go(0)">Menyu</button>`;
                document.getElementById('next-btn').classList.add('hidden');
                return;
            }
            const q = qs[idx];
            document.getElementById('content-area').innerHTML = `
                <h2 style="margin:20px 0;">Dona-dona Rasimli Lug'at (${idx + 1}/${qs.length})</h2>
                <div class="card-box">
                    <div class="card-icon">${q.icon}</div>
                    <div class="card-word">${q.en}</div>
                    <div class="card-uz">${q.uz}</div>
                    <button class="speak-btn" style="padding: 10px 20px; font-size: 16px;" onclick="speakWord('${q.en}')">🔊 Talaffuz</button>
                </div>`;
            document.getElementById('next-btn').textContent = idx === qs.length - 1 ? "Tugatish" : "Keyingisi";
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function renderQ() {
            document.getElementById('feedback-area').innerHTML = ''; document.getElementById('next-btn').classList.add('hidden');
            if(idx >= qs.length) return showRes();
            const q = qs[idx];
            let html = `<div class="q-text">"${q.uz}" - inglizchada nima deyiladi?</div>`;
            if(mode === 2) {
                let wrong = data.filter(x => x.en !== q.en).sort(() => Math.random() - 0.5).slice(0, 3);
                let opts = [q.en, ...wrong.map(x => x.en)].sort(() => Math.random() - 0.5);
                html += `<div class="options-grid">` + opts.map(o => `<button class="test-btn" onclick="selectOpt(this, '${o}')">${o}</button>`).join('') + `</div>
                         <button class="check-btn" id="check-btn" onclick="checkTest()">TEKSHIRISH</button>`;
            } else {
                html += `<input type="text" id="inp" class="spell-input" placeholder="Inglizcha yozing...">
                         <button class="check-btn" id="check-btn" onclick="checkSpell()">TEKSHIRISH</button>`;
            }
            document.getElementById('content-area').innerHTML = html;
        }

        function selectOpt(btn, val) {
            document.querySelectorAll('.test-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedAns = val;
        }

        function checkTest() {
            if(!selectedAns) return alert("Iltimos, javobni tanlang!");
            check(selectedAns);
            document.getElementById('check-btn').classList.add('hidden');
        }

        function check(ans) {
            const q = qs[idx];
            const fb = document.getElementById('feedback-area');
            if(ans === q.en) {
                score++;
                correctList.push(q.uz);
                fb.innerHTML = `<div class="feedback" style="background:#d7ffb8; color:#2b7a0b;">✅ To'g'ri!</div>`;
            } else {
                errs.push(`${q.uz}: "${ans}" (xato) -> ${q.en} (to'g'ri)`);
                fb.innerHTML = `<div class="feedback" style="background:#ffdfe0; color:#ea2b2b;">❌ Xato! To'g'ri javob: ${q.en}</div>`;
            }
            document.getElementById('next-btn').textContent = "Keyingisi";
            document.getElementById('next-btn').classList.remove('hidden');
            if(mode === 2) document.querySelectorAll('.test-btn').forEach(b => b.disabled = true);
            else document.getElementById('check-btn').classList.add('hidden');
        }

        function checkSpell() {
            const val = document.getElementById('inp').value.trim();
            check(val.toLowerCase() === qs[idx].en.toLowerCase() ? qs[idx].en : val);
        }

        function nextQuestion() {
            idx++;
            selectedAns = null;
            if(mode === 5) {
                renderSingleCard();
            } else {
                renderQ();
            }
        }

        function showRes() {
            document.getElementById('content-area').innerHTML = `
                <h2>Test Natijalari</h2>
                <div style="font-size:18px; margin:20px 0;">
                    <p>Umumiy savollar: <b>${qs.length}</b></p>
                    <p style="color:#2b7a0b;">To'g'ri: <b>${score}</b></p>
                    <p style="color:#ea2b2b;">Xato: <b>${qs.length - score}</b></p>
                </div>
                <div style="text-align:left; margin:20px 0;">
                    ${correctList.length > 0 ? `<div style="margin-bottom:10px;">✅ <b>To'g'ri javoblar:</b> ${correctList.join(', ')}</div>` : ''}
                    ${errs.map(e => `<div style="color:#ea2b2b; margin:5px 0;">❌ ${e}</div>`).join('')}
                </div>
                <button class="menu-btn" style="background:#58cc02" onclick="go(0)">Menyu</button>`;
            document.getElementById('feedback-area').innerHTML = '';
        }
    </script>
</body>
</html>
